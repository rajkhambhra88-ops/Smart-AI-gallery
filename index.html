<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Smart AI Gallery</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#101426;color:white;font-family:sans-serif;text-align:center;}
    header{padding:24px 18px;background:linear-gradient(to bottom, #1a1f3c, #101426);}
    h1{margin:0 0 8px;font-size:27px}
    p{color:#dce8ff;margin-bottom:15px;}
    main{padding:18px}
    .search{width:100%;padding:15px;border:1px solid #202743;border-radius:12px;background:#181c35;color:white;font-size:16px;outline:none;margin-bottom:15px;}
    .actions{display:flex;gap:10px;margin:16px 0;justify-content:center;}
    button, .upload{background:#5545d5;color:white;border:none;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;}
    .upload{display:inline-block}
    #files{display:none}
    #photos{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:15px;margin-top:20px;}
    .photo{background:#202743;border-radius:15px;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,0.2);position:relative;}
    .photo img{width:100%;height:140px;object-fit:cover}
    .photo .tags{padding:8px;font-size:12px;color:#8be9fd;word-wrap:break-word;font-weight:bold;}
    .photo button{background:#ff4a4a;padding:6px 12px;font-size:12px;margin:8px 0;width:80%;}
    .empty{color:#bdc7e8;grid-column:1/-1;padding:40px 10px;font-size:16px;}
    .status-alert{background:#202743;color:#8be9fd;padding:10px;border-radius:8px;font-size:12px;margin-bottom:15px;display:inline-block;}
    footer{text-align:center;color:#9ca9cf;padding:25px;font-size:12px;}
  </style>
</head>
<body>
  <header>
    <h1>✦ Smart AI Gallery</h1>
    <p>आपकी यादें, एक खूबसूरत और समझदार जगह पर ❤️</p>
    <div id="ai-status" class="status-alert">ब्रेन लोडिंग... AI तैयार हो रहा है 🧠</div>
  </header>

  <main>
    <input class="search" id="search" type="search" placeholder="यहाँ ढूँढें... (जैसे: person, कार, phone, बोतल)">
    
    <div class="actions">
      <label class="upload">+ फोटो चुनें
        <input id="files" type="file" accept="image/*" multiple>
      </label>
    </div>

    <div id="photos"></div>
  </main>

  <footer>Smart AI Gallery © 2026</footer>

  <script>
    let model = null;
    let images = [];

    const hindiDictionary = {
      'person': 'इंसान व्यक्ति आदमी औरत',
      'car': 'कार गाड़ी वाहन ऑटो',
      'motorcycle': 'मोटरसाइकिल बाइक गाड़ी',
      'airplane': 'हवाई जहाज विमान',
      'bus': 'बस गाड़ी',
      'train': 'ट्रेन रेलगाड़ी',
      'truck': 'ट्रक गाड़ी',
      'boat': 'नाव',
      'bottle': 'बोतल पानी',
      'cup': 'कप चाय प्याला',
      'fork': 'कांटा',
      'knife': 'चाकू',
      'spoon': 'चम्मच',
      'bowl': 'कटोरी बर्तन',
      'banana': 'केला फल',
      'apple': 'सेब फल',
      'sandwich': 'सैंडविच',
      'orange': 'संतरा',
      'chair': 'कुर्सी',
      'couch': 'सोफा',
      'potted plant': 'पौधा गमला फूल गुलाब',
      'bed': 'बिस्तर पलंग चादर',
      'dining table': 'मेज टेबल',
      'tv': 'टीवी टेलीविजन स्क्रीन',
      'laptop': 'लैपटॉप कंप्यूटर',
      'mouse': 'माउस',
      'remote': 'रिमोट',
      'keyboard': 'कीबोर्ड',
      'cell phone': 'मोबाइल फोन',
      'book': 'किताब पुस्तक पेपर पेज',
      'clock': 'घड़ी',
      'cat': 'बिल्ली',
      'dog': 'कुत्ता'
    };

    cocoSsd.load().then(loadedModel => {
      model = loadedModel;
      document.getElementById('ai-status').innerText = "AI तैयार है! नई फोटो जोड़ सकते हैं 🎉";
      document.getElementById('ai-status').style.color = "#50fa7b";
    }).catch(err => {
      document.getElementById('ai-status').innerText = "AI लोड एरर, कृपया पेज रीलोड करें";
      document.getElementById('ai-status').style.color = "#ff5555";
    });

    document.getElementById('files').addEventListener('change', async (e) => {
      if (!model) {
        alert("कृपया AI तैयार होने तक रुकें!");
        return;
      }
      
      const files = Array.from(e.target.files);
      
      for (let file of files) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.src = url;
        
        await new Promise(resolve => {
          img.onload = async () => {
            document.getElementById('ai-status').innerText = "AI स्कैन कर रहा है... 🔍";
            
            // मोबाइल फोटो को स्कैन के लिए कैनवास पर छोटा करना (ताकि AI खाली न छोड़े)
            const canvas = document.createElement('canvas');
            canvas.width = 416;
            canvas.height = 416;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 416, 416);

            let detectedTags = [];
            try {
              // दोनों (कैनवास और असली इमेज) पर डिटेक्शन चलाएं
              let predictions = await model.detect(canvas);
              if (!predictions || predictions.length === 0) {
                predictions = await model.detect(img);
              }

              if (predictions && predictions.length > 0) {
                predictions.forEach(p => {
                  const en = p.class.toLowerCase();
                  if (!detectedTags.includes(en)) detectedTags.push(en);
                  if (hindiDictionary[en]) {
                    hindiDictionary[en].split(' ').forEach(h => {
                      if (!detectedTags.includes(h)) detectedTags.push(h);
                    });
                  }
                });
              }
            } catch (err) {
              console.log(err);
            }

            images.push({
              name: file.name,
              url: url,
              tags: detectedTags
            });

            render();
            resolve();
          };
        });
      }
      document.getElementById('ai-status').innerText = "AI तैयार है! नई फोटो जोड़ सकते हैं 🎉";
    });

    function render() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const area = document.getElementById('photos');
      area.innerHTML = '';

      const list = images.filter(x => {
        const matchName = x.name.toLowerCase().includes(q);
        const matchTag = x.tags && x.tags.some(tag => tag.toLowerCase().includes(q));
        return matchName || matchTag;
      });

      if (!list.length) {
        area.innerHTML = '<div class="empty">कोई फोटो नहीं मिली 🔍</div>';
        return;
      }

      list.forEach(x => {
        const card = document.createElement('div');
        card.className = 'photo';

        const img = document.createElement('img');
        img.src = x.url;
        img.alt = x.name;

        const tagsDiv = document.createElement('div');
        tagsDiv.className = 'tags';
        const displayTags = x.tags && x.tags.length ? x.tags.slice(0, 3).join(', ') : 'पहचान नहीं हो सकी';
        tagsDiv.textContent = `पहचाना: ${displayTags}`;

        const del = document.createElement('button');
        del.textContent = 'हटाएँ';
        del.onclick = () => {
          images = images.filter(y => y !== x);
          URL.revokeObjectURL(x.url);
          render();
        };

        card.append(img, tagsDiv, del);
        area.append(card);
      });
    }

    document.getElementById('search').addEventListener('input', render);
  </script>
</body>
</html>
