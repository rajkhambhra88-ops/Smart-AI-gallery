<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Smart AI Gallery</title>

  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#101426;color:white;font-family:sans-serif;text-align:center;}
    header{padding:20px 16px;background:linear-gradient(to bottom, #1a1f3c, #101426);}
    h1{margin:0 0 6px;font-size:26px}
    p{color:#dce8ff;margin-bottom:12px;font-size:14px;}
    main{padding:14px}
    .search{width:100%;padding:14px;border:1px solid #202743;border-radius:12px;background:#181c35;color:white;font-size:15px;outline:none;margin-bottom:12px;}
    
    .tabs{display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
    .tab-btn{background:#181c35;border:1px solid #202743;color:#dce8ff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;}
    .tab-btn.active{background:#5545d5;color:white;border-color:#5545d5;font-weight:bold;}

    .actions{display:flex;gap:10px;margin:12px 0;justify-content:center;}
    .upload{background:#5545d5;color:white;border:none;padding:12px 24px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;display:inline-block;}
    #files{display:none}
    
    #gallery{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:14px;margin-top:16px;}
    .item-card{background:#202743;border-radius:14px;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,0.3);position:relative;display:flex;flex-direction:column;}
    .item-card img, .item-card video{width:100%;height:140px;object-fit:cover;background:#0b0d19;}
    
    .fav-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    
    .tags{padding:8px;font-size:12px;color:#50fa7b;word-wrap:break-word;font-weight:bold;flex-grow:1;}
    .del-btn{background:#ff4a4a;color:white;border:none;padding:6px;font-size:12px;margin:6px 10px 10px;border-radius:8px;cursor:pointer;}
    
    .empty{color:#bdc7e8;grid-column:1/-1;padding:40px 10px;font-size:15px;}
    .status-alert{background:#202743;color:#8be9fd;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:10px;display:inline-block;}
    footer{text-align:center;color:#9ca9cf;padding:20px;font-size:12px;}
  </style>
</head>
<body>
  <header>
    <h1>✦ Smart AI Gallery</h1>
    <p>आपकी यादें, एक खूबसूरत और समझदार जगह पर ❤️</p>
    <div id="ai-status" class="status-alert">गैलरी तैयार है! अपनी फोटो/वीडियो जोड़ें 🎉</div>
  </header>

  <main>
    <input class="search" id="search" type="search" placeholder="यहाँ नाम या टैग से ढूँढें... (जैसे: Netaji, Army, कार)">
    
    <div class="tabs">
      <button class="tab-btn active" onclick="setTab('all', this)">सभी (All)</button>
      <button class="tab-btn" onclick="setTab('photos', this)">फोटो</button>
      <button class="tab-btn" onclick="setTab('videos', this)">वीडियो</button>
      <button class="tab-btn" onclick="setTab('yaadein', this)">❤️ यादें (Albums)</button>
    </div>

    <div class="actions">
      <label class="upload">+ फोटो / वीडियो जोड़ें
        <input id="files" type="file" accept="image/*,video/*" multiple>
      </label>
    </div>

    <div id="gallery"></div>
  </main>

  <footer>Smart AI Gallery © 2026</footer>

  <script>
    let mediaList = [];
    let currentTab = 'all';

    function setTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    document.getElementById('files').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      for (let file of files) {
        const url = URL.createObjectURL(file);
        const isVideo = file.type.startsWith('video');

        // यूज़र से मनपसंद नाम या टैग पूछना
        let customTag = prompt(`"${file.name}" के लिए कोई नाम या टैग लिखें (उदा: Netaji, Guru Ji, Army, कार):`, "");
        if (customTag === null || customTag.trim() === "") {
          customTag = isVideo ? "वीडियो" : "फोटो";
        }

        mediaList.push({
          id: Date.now() + Math.random(),
          name: file.name,
          url: url,
          type: isVideo ? 'video' : 'photo',
          isFav: false,
          tag: customTag.trim()
        });
      }

      render();
      e.target.value = ''; // रीसेट ताकि दोबारा अपलोड हो सके
    });

    function toggleFav(id) {
      const item = mediaList.find(x => x.id === id);
      if (item) {
        item.isFav = !item.isFav;
        render();
      }
    }

    function deleteItem(id) {
      const item = mediaList.find(x => x.id === id);
      if (item) {
        URL.revokeObjectURL(item.url);
        mediaList = mediaList.filter(x => x.id !== id);
        render();
      }
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const area = document.getElementById('gallery');
      area.innerHTML = '';

      let list = mediaList.filter(x => {
        if (currentTab === 'photos') return x.type === 'photo';
        if (currentTab === 'videos') return x.type === 'video';
        if (currentTab === 'yaadein') return x.isFav === true;
        return true;
      });

      if (q) {
        list = list.filter(x => {
          const matchName = x.name.toLowerCase().includes(q);
          const matchTag = x.tag.toLowerCase().includes(q);
          return matchName || matchTag;
        });
      }

      if (!list.length) {
        area.innerHTML = '<div class="empty">इस सेक्शन में कुछ नहीं मिला 🔍</div>';
        return;
      }

      list.forEach(x => {
        const card = document.createElement('div');
        card.className = 'item-card';

        let mediaEl;
        if (x.type === 'video') {
          mediaEl = document.createElement('video');
          mediaEl.src = x.url;
          mediaEl.controls = true;
        } else {
          mediaEl = document.createElement('img');
          mediaEl.src = x.url;
        }

        const favBtn = document.createElement('button');
        favBtn.className = 'fav-btn';
        favBtn.innerHTML = x.isFav ? '❤️' : '🤍';
        favBtn.onclick = () => toggleFav(x.id);

        const tagsDiv = document.createElement('div');
        tagsDiv.className = 'tags';
        tagsDiv.textContent = `टैग: ${x.tag}`;

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = 'हटाएँ';
        delBtn.onclick = () => deleteItem(x.id);

        card.append(mediaEl, favBtn, tagsDiv, delBtn);
        area.append(card);
      });
    }

    document.getElementById('search').addEventListener('input', render);
  </script>
</body>
</html>
