
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101426">
<title>Smart AI Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101426;color:white;font-family:Arial,sans-serif}
header{padding:24px 18px;background:linear-gradient(135deg,#4836b8,#087fba);border-radius:0 0 26px 26px}
h1{margin:0 0 8px;font-size:27px}
p{color:#dce8ff}
main{padding:18px}
.search{width:100%;padding:15px;border:1px solid #424b70;border-radius:14px;background:#1c2340;color:white;font-size:16px}
.actions{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
button,.upload{background:#5545d5;color:white;border:0;border-radius:12px;padding:12px 15px;font-size:15px;cursor:pointer}
.upload{display:inline-block}
#photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.photo{background:#202743;border-radius:15px;overflow:hidden}
.photo img{width:100%;height:170px;object-fit:cover;display:block}
.photo button{margin:8px}
.empty{color:#bdc7e8;text-align:center;padding:30px 5px;grid-column:1/-1}
footer{text-align:center;color:#9ca9cf;padding:25px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>✦ Smart AI Gallery</h1>
<p>आपकी यादें, एक खूबसूरत जगह पर ❤️</p>
</header>
<main>
<input class="search" id="search" placeholder="🔍 अपनी फोटो खोजें..." oninput="render()">
<div class="actions">
<label class="upload">＋ फोटो चुनें
<input id="files" type="file" accept="image/*" multiple hidden>
</label>
<button onclick="document.getElementById('search').value='';render()">सभी फोटो</button>
</div>
<div id="photos"><div class="empty">अपनी पहली फोटो चुनें 📸</div></div>
</main>
<footer>Smart AI Gallery · आपका निजी फोटो संग्रह</footer>
<script>
let images=[];
document.getElementById('files').addEventListener('change',e=>{
for(const file of e.target.files){
if(file.type.startsWith('image/')){
images.push({name:file.name,url:URL.createObjectURL(file)});
}}
render();
});
function render(){
const q=document.getElementById('search').value.toLowerCase();
const list=images.filter(x=>x.name.toLowerCase().includes(q));
const area=document.getElementById('photos');
area.innerHTML='';
if(!list.length){
area.innerHTML='<div class="empty">कोई फोटो नहीं मिली। फोटो चुनकर शुरुआत करें 📷</div>';
return;
}
list.forEach(x=>{
const card=document.createElement('div');
card.className='photo';
const img=document.createElement('img');
img.src=x.url;img.alt=x.name;
const label=document.createElement('div');
label.style.cssText='padding:10px;font-size:13px;overflow-wrap:anywhere';
label.textContent=x.name;
const del=document.createElement('button');
del.textContent='हटाएँ';
del.onclick=()=>{
images=images.filter(y=>y!==x);
URL.revokeObjectURL(x.url);render();
};
card.append(img,label,del);area.append(card);
});
}
</script>
</body>
</html>
